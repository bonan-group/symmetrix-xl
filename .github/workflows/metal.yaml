name: Metal

# Builds the Apple Metal backend on an Apple-silicon macOS runner and runs its
# runtime self-test and Python tests. Hosted runners are virtual machines; GPU
# tests skip with the reported reason when the virtual GPU lacks the Metal 3
# family or unified memory.

on:
  pull_request:
    paths:
    - 'libsymmetrix/**'
    - 'symmetrix/**'
    - 'tools/**'
    - '.github/workflows/metal.yaml'
  push:
    branches:
    - main
    - metal
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  metal:
    runs-on: macos-15
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Report the GPU
      run: system_profiler SPDisplaysDataType
    - name: Install toolchain
      run: brew install gcc
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Build and run the Metal runtime self-test
      run: |
        uv venv --clear
        source .venv/bin/activate
        uv pip install cmake ninja
        cmake -S libsymmetrix/source/metal -B build-metal-selftest -G Ninja \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-metal-selftest --target symmetrix_metal_selftest
        if ! ./build-metal-selftest/symmetrix_metal_selftest | tee selftest.log; then
          if grep -q "^Metal unavailable" selftest.log; then
            echo "::notice::No Metal device on this runner; the runtime self-test was skipped."
          else
            exit 1
          fi
        fi
    - name: Build and install Symmetrix with the Metal layer
      run: |
        source .venv/bin/activate
        # The default install builds the Metal layer on Apple silicon.
        uv pip install "./symmetrix[test]" -C build-dir=build-metal
    - name: Run the Metal tests
      run: |
        source .venv/bin/activate
        python -c "import symmetrix.symmetrix as n; print('metal supported:', n._metal_supported(), 'device:', n._metal_device_ready())"
        cd symmetrix/test
        pytest -v -rs test_metal_execution.py test_standard_modules.py test_jit.py test_build_tool.py
