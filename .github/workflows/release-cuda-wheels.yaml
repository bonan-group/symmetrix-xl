name: Release CUDA wheels

on:
  workflow_dispatch:
    inputs:
      cuda_major:
        description: CUDA toolkit major version
        required: true
        default: "13"
        type: choice
        options: ["12", "13"]
      target:
        description: CUDA architecture for the backend wheel
        required: true
        default: sm120
        type: choice
        options: [sm70, sm80, sm86, sm89, sm90, sm100, sm120]
      publish_testpypi:
        description: Publish qualified wheels to TestPyPI
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: Publish qualified wheels to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-cuda${{ inputs.cuda_major }}-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CUDA target
    runs-on: ubuntu-latest
    steps:
      - name: Check toolkit compatibility
        env:
          CUDA_MAJOR: ${{ inputs.cuda_major }}
          CUDA_TARGET: ${{ inputs.target }}
        run: |
          if [[ "$CUDA_MAJOR" == 13 && "$CUDA_TARGET" == sm70 ]]; then
            echo "CUDA 13 does not support offline compilation for sm70; select CUDA 12." >&2
            exit 1
          fi

  build:
    name: Build CUDA ${{ inputs.cuda_major }} ${{ inputs.target }} ${{ matrix.python }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [cp310-cp310, cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314]
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and repair in the manylinux CUDA container
        env:
          CUDA_MAJOR: ${{ inputs.cuda_major }}
          CUDA_TARGET: ${{ inputs.target }}
          PYTHON_ABIS: ${{ matrix.python }}
          WHEEL_DIR: wheelhouse/cuda${{ inputs.cuda_major }}
          JOBS: "4"
        run: tools/build_cuda_manylinux_wheels.sh

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: cuda${{ inputs.cuda_major }}-${{ inputs.target }}-${{ matrix.python }}
          path: wheelhouse/cuda${{ inputs.cuda_major }}/${{ matrix.python }}/*.whl
          if-no-files-found: error

  frontend:
    name: Build CPython 3.12 frontend wheel
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and repair frontend wheel
        env:
          PYTHON_ABIS: cp312-cp312
          CPU_TARGET: x86-64-v3
          WHEEL_DIR: wheelhouse/cpu
          JOBS: "4"
        run: tools/build_cpu_manylinux_wheels.sh

      - name: Upload frontend wheel
        uses: actions/upload-artifact@v4
        with:
          name: cuda-qualification-frontend-cp312-cp312
          path: wheelhouse/cpu/cp312-cp312/*.whl
          if-no-files-found: error

  test:
    name: Qualify CUDA ${{ inputs.cuda_major }} ${{ inputs.target }} wheel
    needs: [build, frontend]
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 180
    steps:
      - name: Clone repository tests
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download CPython 3.12 wheel
        uses: actions/download-artifact@v4
        with:
          name: cuda${{ inputs.cuda_major }}-${{ inputs.target }}-cp312-cp312
          path: backend-wheel

      - name: Download matching frontend wheel
        uses: actions/download-artifact@v4
        with:
          name: cuda-qualification-frontend-cp312-cp312
          path: frontend-wheel

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"

      - name: Install frontend and backend wheels together
        run: |
          set -euo pipefail
          uv venv --clear --python 3.12 "$RUNNER_TEMP/symmetrix-cuda-wheel"
          python_path="$RUNNER_TEMP/symmetrix-cuda-wheel/bin/python"
          uv pip install --python "$python_path" \
            frontend-wheel/*.whl backend-wheel/*.whl pytest torch mace-torch

      - name: Prove packaged CUDA libraries and device execution
        env:
          CUDA_MAJOR: ${{ inputs.cuda_major }}
          SYMMETRIX_BACKEND: cuda${{ inputs.cuda_major }}-${{ inputs.target }}
          SYMMETRIX_JIT_CUDA_JIT_BACKEND: nvrtc
        run: |
          set -euo pipefail
          python_path="$RUNNER_TEMP/symmetrix-cuda-wheel/bin/python"
          env -u LD_LIBRARY_PATH "$python_path" - <<'PY'
          import os
          import pathlib
          import symmetrix
          from symmetrix.jit import jit_nvrtc_information

          native = symmetrix.load_backend()
          native._init_kokkos()
          try:
              assert native._kokkos_device_sentinel()
              information = jit_nvrtc_information()
              assert information.get("available") is True, information
              maps = pathlib.Path("/proc/self/maps").read_text()
              major = os.environ["CUDA_MAJOR"]
              if major == "13":
                  expected = {
                      "libcudart.so.13": "cu13",
                      "libcublas.so.13": "cu13",
                      "libnvrtc.so.13": "cu13",
                  }
              else:
                  expected = {
                      "libcudart.so.12": "cuda_runtime",
                      "libcublas.so.12": "cublas",
                      "libnvrtc.so.12": "cuda_nvrtc",
                  }
              for library, package in expected.items():
                  paths = {
                      line.rsplit(None, 1)[-1]
                      for line in maps.splitlines()
                      if library in line and "/" in line.rsplit(None, 1)[-1]
                  }
                  assert paths, f"{library} is not mapped"
                  expected_path = f"/site-packages/nvidia/{package}/lib/"
                  assert all(expected_path in path for path in paths), paths
          finally:
              native._finalize_kokkos()
          print("packaged CUDA libraries and device sentinel passed")
          PY
          env -u LD_LIBRARY_PATH "$RUNNER_TEMP/symmetrix-cuda-wheel/bin/symmetrix" \
            backend show "cuda${{ inputs.cuda_major }}-${{ inputs.target }}" --probe
          env -u LD_LIBRARY_PATH "$RUNNER_TEMP/symmetrix-cuda-wheel/bin/symmetrix" \
            doctor --json

      - name: Run mandatory CUDA wheel tests
        env:
          SYMMETRIX_BACKEND: cuda${{ inputs.cuda_major }}-${{ inputs.target }}
          SYMMETRIX_JIT_CUDA_JIT_BACKEND: nvrtc
          SYMMETRIX_REQUIRED_TEST_MANIFEST: cuda_runtime_required_tests.json
        run: |
          cd symmetrix/test
          env -u LD_LIBRARY_PATH "$RUNNER_TEMP/symmetrix-cuda-wheel/bin/pytest" -q \
            test_cuda_runtime.py::test_cuda_r1_nvrtc_module_matches_generic \
            test_mh1.py::test_mh1_generated_cuda_handles_nondivisible_second_subgroup_iteration

      - name: Run full applicable test suite
        env:
          SYMMETRIX_BACKEND: cuda${{ inputs.cuda_major }}-${{ inputs.target }}
          SYMMETRIX_JIT_CUDA_JIT_BACKEND: nvrtc
        run: |
          cd symmetrix/test
          env -u LD_LIBRARY_PATH "$RUNNER_TEMP/symmetrix-cuda-wheel/bin/pytest" -q

  publish-testpypi:
    name: Publish to TestPyPI
    if: inputs.publish_testpypi
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/symmetrix-xl-cuda${{ inputs.cuda_major }}-${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - name: Download all repaired wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cuda${{ inputs.cuda_major }}-${{ inputs.target }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: Publish to PyPI
    if: inputs.publish_pypi
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/symmetrix-xl-cuda${{ inputs.cuda_major }}-${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - name: Download all repaired wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cuda${{ inputs.cuda_major }}-${{ inputs.target }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Compute release manifest
        run: |
          mkdir release-manifest
          sha256sum wheelhouse/*.whl > release-manifest/SHA256SUMS
          cat release-manifest/SHA256SUMS

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-cuda${{ inputs.cuda_major }}-${{ inputs.target }}
          path: release-manifest/SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          attestations: true
