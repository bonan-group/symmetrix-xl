# CUDA wheel release pipeline.
#
# Build and test one representative wheel locally on matching target hardware
# before dispatching this workflow. GitHub-hosted jobs then build the CPython
# wheel matrix and publish it through Trusted Publishing; they do not perform
# GPU runtime qualification.
name: Release CUDA wheels

on:
  workflow_dispatch:
    inputs:
      cuda_major:
        description: CUDA toolkit major version
        required: true
        default: "13"
        type: choice
        options: ["12", "13"]
      target:
        description: CUDA architecture for the backend wheel
        required: true
        default: sm120
        type: choice
        options: [sm70, sm80, sm86, sm89, sm90, sm100, sm120]
      publish_testpypi:
        description: Publish locally qualified wheels to TestPyPI
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: Publish locally qualified wheels to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-cuda${{ inputs.cuda_major }}-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CUDA target
    runs-on: ubuntu-latest
    steps:
      - name: Check toolkit compatibility
        env:
          CUDA_MAJOR: ${{ inputs.cuda_major }}
          CUDA_TARGET: ${{ inputs.target }}
        run: |
          if [[ "$CUDA_MAJOR" == 13 && "$CUDA_TARGET" == sm70 ]]; then
            echo "CUDA 13 does not support offline compilation for sm70; select CUDA 12." >&2
            exit 1
          fi

  build:
    name: Build CUDA ${{ inputs.cuda_major }} ${{ inputs.target }} ${{ matrix.python }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [cp310-cp310, cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314]
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and repair in the manylinux CUDA container
        env:
          CUDA_MAJOR: ${{ inputs.cuda_major }}
          CUDA_TARGET: ${{ inputs.target }}
          PYTHON_ABIS: ${{ matrix.python }}
          WHEEL_DIR: wheelhouse/cuda${{ inputs.cuda_major }}
          JOBS: "4"
        run: tools/build_cuda_manylinux_wheels.sh

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: cuda${{ inputs.cuda_major }}-${{ inputs.target }}-${{ matrix.python }}
          path: wheelhouse/cuda${{ inputs.cuda_major }}/${{ matrix.python }}/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: inputs.publish_testpypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/symmetrix-xl-cuda${{ inputs.cuda_major }}-${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - name: Download all repaired wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cuda${{ inputs.cuda_major }}-${{ inputs.target }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: Publish to PyPI
    if: inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/symmetrix-xl-cuda${{ inputs.cuda_major }}-${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - name: Download all repaired wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cuda${{ inputs.cuda_major }}-${{ inputs.target }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Compute release manifest
        run: |
          mkdir release-manifest
          sha256sum wheelhouse/*.whl > release-manifest/SHA256SUMS
          cat release-manifest/SHA256SUMS

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-cuda${{ inputs.cuda_major }}-${{ inputs.target }}
          path: release-manifest/SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          attestations: true
