# CUDA wheel release pipeline.
#
# Qualify intended targets locally on matching hardware before dispatching this
# workflow. GitHub-hosted jobs build every supported CUDA/CPython combination
# and publish each architecture-specific project through Trusted Publishing;
# they do not perform GPU runtime qualification.
name: Release CUDA wheels

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish all CUDA variants to TestPyPI
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: Publish all CUDA variants to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: Verify release metadata and publication ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate version sources and release tag
        run: |
          python tools/check_release_metadata.py
          if [[ "${{ inputs.publish_pypi }}" == "true" || "${{ inputs.publish_testpypi }}" == "true" ]]; then
            python tools/check_release_metadata.py --require-tag
          fi

  build:
    name: Build CUDA ${{ matrix.cuda_major }} ${{ matrix.target }}
    needs: release-metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_major: ["12", "13"]
        target: [sm70, sm80, sm86, sm89, sm90, sm100, sm120]
        exclude:
          - cuda_major: "13"
            target: sm70
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and repair in the manylinux CUDA container
        env:
          CUDA_MAJOR: ${{ matrix.cuda_major }}
          CUDA_TARGET: ${{ matrix.target }}
          PYTHON_ABIS: cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314
          WHEEL_DIR: wheelhouse/cuda${{ matrix.cuda_major }}-${{ matrix.target }}
          JOBS: "4"
        run: tools/build_cuda_manylinux_wheels.sh

      - name: Collect and verify the CPython wheel matrix
        env:
          CUDA_MAJOR: ${{ matrix.cuda_major }}
          CUDA_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p wheelhouse/release
          find "wheelhouse/cuda${CUDA_MAJOR}-${CUDA_TARGET}" \
            -type f -name '*.whl' -exec cp -t wheelhouse/release {} +
          ls -lh wheelhouse/release
          test "$(find wheelhouse/release -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 5

      - name: Audit repaired CUDA wheels and platform policy
        env:
          CUDA_MAJOR: ${{ matrix.cuda_major }}
          CUDA_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check auditwheel
          for wheel in wheelhouse/release/*.whl; do
            python tools/audit_cuda_release_wheel.py "$wheel" \
              --cuda-major "$CUDA_MAJOR" --target "$CUDA_TARGET"
            auditwheel show "$wheel" | tee "${wheel%.whl}.auditwheel.txt"
            grep -q 'manylinux_2_28' "${wheel%.whl}.auditwheel.txt"
          done

      - name: Install each CUDA wheel without dependencies
        env:
          CUDA_MAJOR: ${{ matrix.cuda_major }}
          CUDA_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/cuda-wheelcheck"
          "$RUNNER_TEMP/cuda-wheelcheck/bin/pip" install --no-deps wheelhouse/release/*-cp312-cp312-*.whl
          "$RUNNER_TEMP/cuda-wheelcheck/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          from pathlib import Path

          dist_name = f"symmetrix-xl-cuda{os.environ['CUDA_MAJOR']}-{os.environ['CUDA_TARGET']}"
          dist = metadata.distribution(dist_name)
          selector = f"cuda{os.environ['CUDA_MAJOR']}-{os.environ['CUDA_TARGET']}"
          points = [p for p in dist.entry_points if p.group == "symmetrix.backends"]
          assert [(p.name, p.value) for p in points] == [
              (selector, f"symmetrix_backend_{selector.replace('-', '_')}"),
          ], points
          package = Path(dist.locate_file(f"symmetrix_backend_{selector.replace('-', '_')}"))
          descriptor = json.loads((package / "backend.json").read_text())
          assert descriptor["selector"] == selector, descriptor
          assert (package / f"_native_{selector.replace('-', '_')}.so").exists()
          assert (package / "_operator_artifacts/catalog.json").exists()
          print("CUDA wheel metadata/import contract OK", dist_name)
          PY

      - name: Compute wheel SHA256 manifest
        run: |
          mkdir -p release-manifest
          (cd wheelhouse/release && sha256sum *.whl) > release-manifest/SHA256SUMS
          cat release-manifest/SHA256SUMS

      - name: Upload wheel and audit manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cuda${{ matrix.cuda_major }}-${{ matrix.target }}
          path: wheelhouse/release/*.whl
          if-no-files-found: error

      - name: Upload CUDA wheel audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuda${{ matrix.cuda_major }}-${{ matrix.target }}-audit
          path: |
            wheelhouse/release/*.auditwheel.txt
            release-manifest/SHA256SUMS
          if-no-files-found: error


  publish-testpypi:
    name: Publish CUDA ${{ matrix.cuda_major }} ${{ matrix.target }} to TestPyPI
    if: inputs.publish_testpypi
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_major: ["12", "13"]
        target: [sm70, sm80, sm86, sm89, sm90, sm100, sm120]
        exclude:
          - cuda_major: "13"
            target: sm70
    environment:
      name: testpypi-cuda${{ matrix.cuda_major }}-${{ matrix.target }}
      url: https://test.pypi.org/p/symmetrix-xl-cuda${{ matrix.cuda_major }}-${{ matrix.target }}
    permissions:
      id-token: write
    steps:
      - name: Download all repaired wheels
        uses: actions/download-artifact@v4
        with:
          name: cuda${{ matrix.cuda_major }}-${{ matrix.target }}
          path: wheelhouse

      - name: Download CUDA wheel audit artifact
        uses: actions/download-artifact@v4
        with:
          name: cuda${{ matrix.cuda_major }}-${{ matrix.target }}-audit
          path: audit

      - name: Verify wheel SHA256 manifest
        run: |
          manifest=audit/SHA256SUMS
          test -f "$manifest"
          while read -r checksum name; do
            printf '%s  wheelhouse/%s\n' "$checksum" "$name" | sha256sum -c -
          done < "$manifest"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: true

  publish-pypi:
    name: Publish CUDA ${{ matrix.cuda_major }} ${{ matrix.target }} to PyPI
    if: inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_major: ["12", "13"]
        target: [sm70, sm80, sm86, sm89, sm90, sm100, sm120]
        exclude:
          - cuda_major: "13"
            target: sm70
    environment:
      name: pypi-cuda${{ matrix.cuda_major }}-${{ matrix.target }}
      url: https://pypi.org/p/symmetrix-xl-cuda${{ matrix.cuda_major }}-${{ matrix.target }}
    permissions:
      id-token: write
    steps:
      - name: Download all repaired wheels
        uses: actions/download-artifact@v4
        with:
          name: cuda${{ matrix.cuda_major }}-${{ matrix.target }}
          path: wheelhouse

      - name: Download CUDA wheel audit artifact
        uses: actions/download-artifact@v4
        with:
          name: cuda${{ matrix.cuda_major }}-${{ matrix.target }}-audit
          path: audit

      - name: Verify wheel SHA256 manifest
        run: |
          manifest=audit/SHA256SUMS
          test -f "$manifest"
          while read -r checksum name; do
            printf '%s  wheelhouse/%s\n' "$checksum" "$name" | sha256sum -c -
          done < "$manifest"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          attestations: true
          skip-existing: true
