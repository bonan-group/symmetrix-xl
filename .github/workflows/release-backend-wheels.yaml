# Symmetrix-XL CPU AVX-512 add-on wheel release pipeline.
#
# Builds the x86-64-v4 CPU add-on wheels only:
#   * symmetrix-xl-cpu-avx512       x86-64-v4 CPU add-on, manylinux_2_28
#
# GPU releases start with one local target-hardware build and test. Then
# release-cuda-wheels.yaml builds the CPython matrix on GitHub-hosted runners
# and publishes it through Trusted Publishing. The publish job below covers
# only the CI-built CPU add-on.
#
# Release runbook order: publish the base `symmetrix-xl` wheels first
# (release-cpu-wheels.yaml), then this workflow, then dispatch
# release-cuda-wheels.yaml for locally qualified GPU targets.
#
# Required repository settings:
#   * PyPI project "symmetrix-xl-cpu-avx512" configured with a Trusted
#     Publisher pointing at this repository/workflow ("publish" job
#     environment: pypi).
#   * Actions permissions: read-only; the publish job needs id-token: write.

name: Release backend wheels

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish qualified artifacts to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.3"
  CMAKE_SHA256: "d6c83076c575bc00b823522ac974bda66d0af05d6ddc30e739c12385cf32c6cc"
  OPENBLAS_VERSION: "0.3.29"
  OPENBLAS_SHA256: "38240eee1b29e2bde47ebb5d61160207dc68668a54cac62c076bb5032013b1eb"

jobs:
  release-metadata:
    name: Verify release metadata and publication ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate version sources and release tag
        run: |
          python tools/check_release_metadata.py
          if [[ "${{ inputs.publish_pypi }}" == "true" ]]; then
            python tools/check_release_metadata.py --require-tag
          fi

  build-cpu-v4:
    name: Build cpu avx512 ${{ matrix.python }}
    needs: release-metadata
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        python: ["cp310-cp310", "cp311-cp311", "cp312-cp312", "cp313-cp313", "cp314-cp314"]
    steps:
      - name: Clone repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system build dependencies
        run: |
          dnf install -y gcc-gfortran git patchelf make binutils

      - name: Install a real CMake binary
        run: |
          curl -sSL -o /tmp/cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          echo "${CMAKE_SHA256}  /tmp/cmake.tar.gz" | sha256sum -c -
          tar xz -C /opt -f /tmp/cmake.tar.gz
          ln -sf "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake" /usr/local/bin/cmake
          cmake --version | head -1

      - name: Build pinned OpenBLAS (DYNAMIC_ARCH, OpenMP)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/openblas.tar.gz "https://github.com/OpenMathLib/OpenBLAS/releases/download/v${OPENBLAS_VERSION}/OpenBLAS-${OPENBLAS_VERSION}.tar.gz"
          echo "${OPENBLAS_SHA256}  /tmp/openblas.tar.gz" | sha256sum -c -
          tar xz -C /tmp -f /tmp/openblas.tar.gz
          cd "/tmp/OpenBLAS-${OPENBLAS_VERSION}"
          log=/tmp/openblas-build.log
          if ! make -s -j"$(nproc)" DYNAMIC_ARCH=1 USE_OPENMP=1 NUM_THREADS=64 NO_SHARED=0 >"$log" 2>&1; then
            tail -n 200 "$log"
            exit 1
          fi
          if ! make -s PREFIX=/usr/local/openblas install >"$log" 2>&1; then
            tail -n 200 "$log"
            exit 1
          fi
          printf '%s\n' /usr/local/openblas/lib > /etc/ld.so.conf.d/symmetrix-openblas.conf
          ldconfig
          ldconfig -p | grep -q 'libopenblas\.so'

      - name: Build the x86-64-v4 add-on wheel
        run: |
          export PATH="/opt/python/${{ matrix.python }}/bin:/usr/local/bin:$PATH"
          export CMAKE_PREFIX_PATH=/usr/local/openblas
          export LIBRARY_PATH=/usr/local/openblas/lib
          export LD_LIBRARY_PATH=/usr/local/openblas/lib
          python tools/symmetrix_build.py wheel-matrix \
            --target cpu:avx512 \
            --prebuilt-operator-artifacts r0 \
            --prebuilt-oam-artifacts known \
            --wheel-dir dist

      - name: Repair the wheel to manylinux
        run: |
          /opt/python/${{ matrix.python }}/bin/python -m pip install auditwheel
          auditwheel show dist/*.whl
          auditwheel repair dist/*.whl -w dist-repaired --plat manylinux_2_28_x86_64
          ls -lh dist-repaired

      - name: Audit repaired wheel
        run: |
          set -euo pipefail
          repaired_wheels=(dist-repaired/*.whl)
          if [ "${#repaired_wheels[@]}" -ne 1 ] || [ ! -f "${repaired_wheels[0]}" ]; then
            echo "expected exactly one repaired wheel" >&2
            exit 1
          fi
          /opt/python/${{ matrix.python }}/bin/python \
            tools/check_wheel_contents.py "${repaired_wheels[0]}"
          /opt/python/${{ matrix.python }}/bin/python \
            -m auditwheel show "${repaired_wheels[0]}"

      - name: Layout sentinels
        run: |
          set -e
          /opt/python/${{ matrix.python }}/bin/python - <<'PY'
          import glob, json, zipfile
          wheel = glob.glob("dist-repaired/*.whl")[0]
          platform_tags = wheel.removesuffix(".whl").rsplit("-", 1)[-1].split(".")
          assert "manylinux_2_28_x86_64" in platform_tags, wheel
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              expected = "symmetrix_backend_cpu_avx512"
              assert any(n == f"{expected}/backend.json" for n in names), names[:8]
              assert any(
                  n == f"{expected}/_native_cpu_avx512.so"
                  or (
                      n.startswith(f"{expected}/_native_cpu_avx512.")
                      and n.endswith(".so")
                  )
                  for n in names
              ), names[:8]
              descriptor = json.loads(
                  archive.read(f"{expected}/backend.json")
              )
              assert descriptor["selector"] == "cpu-avx512", descriptor
              assert descriptor["architecture"] == "x86-64-v4", descriptor
              assert not any(n.startswith("symmetrix/") for n in names), names[:8]
          print("wheel layout OK:", wheel)
          PY

      - name: Install repaired wheel and prove metadata, catalog, and AVX-512 codegen
        run: |
          set -euo pipefail
          export PATH="/opt/python/${{ matrix.python }}/bin:/usr/local/bin:$PATH"
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --no-deps dist-repaired/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          import hashlib
          import importlib.metadata as md
          import json
          from pathlib import Path

          dist = md.distribution("symmetrix-xl-cpu-avx512")
          requires = dist.requires or []
          assert any(
              requirement.split(";")[0].strip().startswith("symmetrix-xl==")
              for requirement in requires
          ), requires
          points = [
              point for point in dist.entry_points
              if point.group == "symmetrix.backends"
          ]
          assert len(points) == 1, points
          assert points[0].name == "cpu-avx512", points
          assert points[0].value == "symmetrix_backend_cpu_avx512", points
          files = {str(item) for item in dist.files or []}
          assert "symmetrix_backend_cpu_avx512/__init__.py" in files, sorted(files)[:8]
          package_root = Path(
              dist.locate_file("symmetrix_backend_cpu_avx512")
          ).resolve()
          descriptor = json.loads((package_root / "backend.json").read_text())
          assert descriptor["selector"] == "cpu-avx512", descriptor
          assert descriptor["architecture"] == "x86-64-v4", descriptor
          catalog_path = package_root / "_operator_artifacts/catalog.json"
          catalog = json.loads(catalog_path.read_text())
          prebuilt = descriptor["prebuilt_operator_artifacts"]
          assert prebuilt["mode"] == "r0", prebuilt
          assert prebuilt["backend"] == "host", prebuilt
          assert prebuilt["target"] == "x86-64-v4", prebuilt
          assert prebuilt["artifact_count"] == 14, prebuilt
          assert len(catalog["artifacts"]) == 14, catalog
          assert sum(
              item["operator"] == "OAM" for item in catalog["artifacts"]
          ) == 8, catalog
          assert {
              item["identity"]["backend"] for item in catalog["artifacts"]
          } == {"host"}, catalog
          assert {
              item["identity"]["target"] for item in catalog["artifacts"]
          } == {"x86-64-v4"}, catalog
          assert prebuilt["catalog_sha256"] == hashlib.sha256(
              catalog_path.read_bytes()
          ).hexdigest(), prebuilt
          print("installed repaired wheel metadata and catalog OK")
          PY
          so="$(find /tmp/wheelcheck -type f -name '_native_cpu_avx512*.so' | head -n 1)"
          test -n "$so"
          objdump -d "$so" | awk '/zmm/ { found=1 } END { exit !found }' || {
            echo "no AVX-512 vector code found in $so"; exit 1;
          }
          echo "AVX-512 codegen sentinel OK: $so"

      - name: Probe AVX-512 runtime when host supports x86-64-v4
        run: |
          set -euo pipefail
          cpu_flags=""
          while IFS= read -r line; do
            if [[ "$line" == flags* ]]; then
              cpu_flags="${line#*: }"
              break
            fi
          done < /proc/cpuinfo
          missing_flags=()
          for flag in avx512f avx512bw avx512cd avx512dq avx512vl; do
            if ! grep -qw "$flag" <<<"$cpu_flags"; then
              missing_flags+=("$flag")
            fi
          done
          if [ "${#missing_flags[@]}" -ne 0 ]; then
            echo "Skipping x86-64-v4 runtime probe; host lacks: ${missing_flags[*]}"
            exit 0
          fi
          /tmp/wheelcheck/bin/python - <<'PY'
          import importlib

          native = importlib.import_module(
              "symmetrix_backend_cpu_avx512._native_cpu_avx512"
          )
          build_info = native._backend_build_info()
          prebuilt = build_info["prebuilt_operator_artifacts"]
          assert prebuilt["mode"] == "r0", prebuilt
          assert prebuilt["backend"] == "host", prebuilt
          assert prebuilt["target"] == "x86-64-v4", prebuilt
          assert prebuilt["artifact_count"] == 14, prebuilt
          native._init_kokkos()
          try:
              assert native._kokkos_default_execution_space() == "OpenMP"
          finally:
              native._finalize_kokkos()
          print("installed repaired wheel AVX-512 runtime OK")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpu-avx512-${{ matrix.python }}
          path: dist-repaired/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: inputs.publish_pypi
    needs: build-cpu-v4
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cpu-avx512-*
          path: dist-repaired
          merge-multiple: true

      - name: Collision gate (one artifact per target)
        run: |
          ls dist-repaired/*.whl
          test "$(ls dist-repaired/*.whl | wc -l)" -eq "$(ls dist-repaired/*.whl | xargs -n1 basename | sort -u | wc -l)"

      - name: Compute release manifest
        run: |
          mkdir release-manifest
          sha256sum dist-repaired/*.whl > release-manifest/SHA256SUMS
          cat release-manifest/SHA256SUMS

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-backends
          path: release-manifest/SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-repaired
          attestations: true
