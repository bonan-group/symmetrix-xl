name: CI

on:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
    - name: Run pre-commit
      run: uvx pre-commit run --all-files

  symmetrix:
    runs-on: ubuntu-latest
    env:
      SYMMETRIX_TEST_MODEL_DOWNLOADS: "0"
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libopenblas-dev libfftw3-dev liblapack-dev ninja-build
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Create python venv and install
      run: |
        uv venv --clear
        source .venv/bin/activate
        uv pip install scikit-build-core pybind11 ninja pytest numpy scipy ase matscipy
        source_fingerprint=$(python -c 'from pathlib import Path; from tools._symmetrix_build.source_provenance import symmetrix_source_fingerprint; print(symmetrix_source_fingerprint(Path.cwd()))')
        uv pip install ./symmetrix \
          --config-settings=build-dir="$RUNNER_TEMP/symmetrix-cpu-build" \
          --config-settings="cmake.define.SYMMETRIX_BUILD_SOURCE_CONTENT_SHA256=$source_fingerprint" \
          --config-settings=cmake.define.SYMMETRIX_PARTICLE_MESH=ON
        deactivate
    - name: Run tests
      run: |
        source .venv/bin/activate
        python -c "import symmetrix; print(symmetrix.__version__)"
        python - <<'PY'
        import importlib.util
        for name in ("torch", "mace", "graph_longrange"):
            assert importlib.util.find_spec(name) is None, name
        PY
        pytest -q -m 'not extended' symmetrix/test \
          --ignore=symmetrix/test/test_extract_mace_data.py \
          --ignore=symmetrix/test/test_mace_streamed_edges.py \
          --ignore=symmetrix/test/test_polar_torch_baseline.py \
          --ignore=symmetrix/test/test_single_layer_mace.py \
          --ignore=symmetrix/test/test_jit_kokkos_integration.py \
          --ignore=symmetrix/test/test_jit_device_artifact.py \
          --ignore=symmetrix/test/test_mace_les_readout.py \
          --ignore=symmetrix/test/test_jit_operator_cuda.py \
          --ignore=symmetrix/test/test_mace_polar_frontend.py \
          --ignore=symmetrix/test/test_bench_cli.py \
          --ignore=symmetrix/test/test_family_registry.py \
          --ignore=symmetrix/test/test_mh1.py \
          --ignore=symmetrix/test/test_polar_s_direct.py
        pytest -q \
          symmetrix/test/test_polar_oracle_fixtures.py \
          symmetrix/test/test_polar_end_to_end_fixtures.py \
          symmetrix/test/test_mace_les_reference.py
        deactivate
        cd ../..

  metatrain-mace:
    runs-on: ubuntu-latest
    env:
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libblas-dev liblapack-dev ninja-build
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Create python venv and install
      run: |
        uv venv --clear
        source .venv/bin/activate
        uv pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.*"
        uv pip install \
          "metatrain[mace]==2026.4.1" \
          pytest
        source_fingerprint=$(python -c 'from pathlib import Path; from tools._symmetrix_build.source_provenance import symmetrix_source_fingerprint; print(symmetrix_source_fingerprint(Path.cwd()))')
        uv pip install ./symmetrix \
          --config-settings=cmake.define.SYMMETRIX_HOST_ARCH=x86-64-v3 \
          --config-settings="cmake.define.SYMMETRIX_BUILD_SOURCE_CONTENT_SHA256=$source_fingerprint"
        deactivate
    - name: Test native MACE import and metatrain export
      run: |
        source .venv/bin/activate
        pytest -q symmetrix/test/test_extract_mace_data.py \
          -k metatrain_native_checkpoint_and_export_round_trip
        deactivate

  pair_symmetrix:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache cmake gfortran git libopenblas-dev libopenmpi-dev mpi-default-bin mpi-default-dev
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Create python venv and install
      run: |
        uv venv --clear
        source .venv/bin/activate
        uv pip install pip pytest "./symmetrix" \
          "mace-torch @ git+https://github.com/mdi-group/mace-field.git@1.0.2"
        deactivate
    - name: Cache test models
      uses: actions/cache@v4
      with:
        path: ~/.cache/symmetrix/test-models
        key: symmetrix-test-models-macefield-1.0.2
    - name: Clone pinned LAMMPS source
      run: |
        git init lammps
        git -C lammps remote add origin https://github.com/lammps/lammps.git
        git -C lammps fetch --depth 1 origin 0165101ce505734e8fb249694b22e295a7ab4182
        git -C lammps checkout --detach FETCH_HEAD
    - name: Cache C++ compiler results
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('pair_symmetrix/**') }}
        restore-keys: |
          ccache-${{ runner.os }}-
    - name: Build LAMMPS
      run: |
        source .venv/bin/activate
        python tools/symmetrix_build.py lammps \
          --source "$GITHUB_WORKSPACE/lammps" \
          --prefix "$RUNNER_TEMP/lammps-install" \
          --build-root "$RUNNER_TEMP/symmetrix-lammps-build" \
          --backend cpu \
          --cpu-target x86-64-v3 \
          --blas openblas \
          --particle-mesh off \
          --mpi on \
          --install-python-module \
          --lammps-cmake-define CMAKE_CXX_COMPILER_LAUNCHER=ccache \
          --jobs 4
        test -x "$RUNNER_TEMP/lammps-install/bin/lmp"
        "$RUNNER_TEMP/lammps-install/bin/lmp" -help | grep -F 'symmetrix/mace/kk'
        python -c "from lammps import lammps; instance = lammps(cmdargs=['-screen', 'none']); instance.close()"
        echo "SYMMETRIX_LAMMPS_EXECUTABLE=$RUNNER_TEMP/lammps-install/bin/lmp" >> "$GITHUB_ENV"
        deactivate

    - name: Run required residual-first integration test
      run: |
        source .venv/bin/activate
        TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1 \
        SYMMETRIX_REQUIRE_LAMMPS_TESTS=1 \
          pytest -q pair_symmetrix/test/test_pair_symmetrix_factorized_mpi.py \
            -k test_manual_schedules_match_whole_model_for_residual_first_models
        deactivate

    - name: Run pair style test suite
      run: |
        source .venv/bin/activate
        cd pair_symmetrix/test
        TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1 \
          pytest -q -k 'not test_manual_schedules_match_whole_model_for_residual_first_models'
        deactivate

  extract-mace-model:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - mace-torch: "mace-torch==0.3.10"
          torch: "torch==2.5.*"
          mace_field_compatible: false
        - mace-torch: "mace-torch==0.3.16"
          torch: "torch==2.5.*"
          mace_field_compatible: false
        - mace-torch: "mace-torch @ git+https://github.com/mdi-group/mace-field.git@1.0.2"
          torch: "torch==2.5.*"
          mace_field_compatible: true
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libblas-dev liblapack-dev ninja-build
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Cache Symmetrix native build
      uses: actions/cache@v4
      with:
        path: symmetrix/build
        key: symmetrix-native-build-${{ runner.os }}-x86-64-v3-${{ hashFiles('symmetrix/CMakeLists.txt', 'symmetrix/pyproject.toml', 'symmetrix/source/**', 'libsymmetrix/source/**', 'libsymmetrix/CMakeLists.txt', 'libsymmetrix/include/**', 'libsymmetrix/external/**') }}
    - name: Create python venv and install
      run: |
        uv venv --clear
        source .venv/bin/activate
        uv pip install --index-url https://download.pytorch.org/whl/cpu "${{ matrix.torch }}"
        source_fingerprint=$(python -c 'from pathlib import Path; from tools._symmetrix_build.source_provenance import symmetrix_source_fingerprint; print(symmetrix_source_fingerprint(Path.cwd()))')
        uv pip install "${{ matrix.mace-torch }}" pytest \
          --config-settings=cmake.define.SYMMETRIX_HOST_ARCH=x86-64-v3 \
          --config-settings="cmake.define.SYMMETRIX_BUILD_SOURCE_CONTENT_SHA256=$source_fingerprint" \
          "./symmetrix[mace]"
        deactivate
    - name: Cache test models
      uses: actions/cache@v4
      with:
        path: ~/.cache/symmetrix/test-models
        key: symmetrix-test-models-macefield-1.0.2
    - name: Test MACEField model download
      run: |
        source .venv/bin/activate
        PYTHONPATH=symmetrix/test python -c "from model_downloads import macefield_model_path; print(macefield_model_path())"
        deactivate
    - name: Test compact MACEField conversion and ASE integration
      if: matrix.mace_field_compatible
      env:
        SYMMETRIX_JIT_CACHE: ${{ runner.temp }}/symmetrix-jit-cache
      run: |
        source .venv/bin/activate
        cd symmetrix/test
        pytest -q \
          test_extract_mace_data.py \
          test_jit_device_artifact.py \
          test_mace_les_readout.py \
          test_field_calculators.py \
          test_macefield_native.py \
          test_macefield_indexing_source.py \
          test_mace_streamed_edges.py \
          test_symmetrix_calc.py::test_compact_macefield_calculator_replaces_active_composition_cache \
          test_symmetrix_calc.py::test_macefield_native_json_ase_response_properties_match_pytorch \
          test_symmetrix_calc.py::test_macefield_json_with_kokkos_requested_constructs_kokkos_evaluator \
          test_mace_streamed_edges.py::test_legacy_pair_spline_models_warn_and_default_to_legacy
        deactivate
    - name: Cache MACE-MH-1 checkpoint
      if: matrix.mace_field_compatible
      uses: actions/cache@v4
      with:
        path: ~/.cache/symmetrix/test-models/mace-mh-1.model
        key: mace-mh-1-a522eb7f59c7879963d41586528f4980baf33e086c94aa92e3eafdeccad3be47
    - name: Download and verify MACE-MH-1 checkpoint
      if: matrix.mace_field_compatible
      run: |
        mkdir -p ~/.cache/symmetrix/test-models
        if [ ! -f ~/.cache/symmetrix/test-models/mace-mh-1.model ]; then
          curl --fail --location --retry 3 \
            https://github.com/ACEsuit/mace-foundations/releases/download/mace_mh_1/mace-mh-1.model \
            --output ~/.cache/symmetrix/test-models/mace-mh-1.model
        fi
        echo "a522eb7f59c7879963d41586528f4980baf33e086c94aa92e3eafdeccad3be47  $HOME/.cache/symmetrix/test-models/mace-mh-1.model" \
          | sha256sum --check --strict
    - name: Test standard MACE-MH-1 checkpoint integration
      if: matrix.mace_field_compatible
      env:
        TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
      run: |
        source .venv/bin/activate
        if ! sudo swapon --show | grep -q '^/swapfile-ci'; then
          sudo fallocate -l 6G /swapfile-ci \
            || echo "::warning::fallocate /swapfile-ci failed"
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci \
            || echo "::warning::swapon /swapfile-ci failed"
        fi
        swapon --show || true
        free -h
        df -h /
        cd symmetrix/test
        mkdir -p /tmp/mh1-logs
        set -o pipefail
        status=0
        SYMMETRIX_MH1_MODEL="$HOME/.cache/symmetrix/test-models/mace-mh-1.model" \
          pytest -q test_mh1.py \
          -k "not universal_extraction and not raw_checkpoint and not json_dispatch and not extracts_and_evaluates_each_head" \
          2>&1 | tee /tmp/mh1-logs/chunk-core.log \
          || status=1
        SYMMETRIX_MH1_MODEL="$HOME/.cache/symmetrix/test-models/mace-mh-1.model" \
          pytest -q test_mh1.py -k "extracts_and_evaluates_each_head" \
          2>&1 | tee /tmp/mh1-logs/chunk-heads.log \
          || status=1
        SYMMETRIX_MH1_MODEL="$HOME/.cache/symmetrix/test-models/mace-mh-1.model" \
          pytest -q test_mh1.py \
          -k "universal_extraction or raw_checkpoint or json_dispatch" \
          2>&1 | tee /tmp/mh1-logs/chunk-heavy.log \
          || status=1
        test "$status" -eq 0
        deactivate
    - name: Upload MH-1 test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: mh1-test-logs
        path: /tmp/mh1-logs/
        if-no-files-found: ignore
    - name: Cache pinned MACE-OFF23 checkpoint
      uses: actions/cache@v4
      with:
        path: ~/.cache/symmetrix/mace-off23/MACE-OFF23_small.model
        key: mace-off23-small-165cce4cfec5a34b9c64d4ebf95de15d71106bb584b7291c8470f0749977c46f
    - name: Download and verify pinned MACE-OFF23 checkpoint
      run: |
        model="$HOME/.cache/symmetrix/mace-off23/MACE-OFF23_small.model"
        checksum=165cce4cfec5a34b9c64d4ebf95de15d71106bb584b7291c8470f0749977c46f
        mkdir -p "$(dirname "$model")"
        if ! echo "$checksum  $model" | sha256sum --check --strict; then
          trap 'rm -f "$model.part"' EXIT
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 120 --retry-max-time 600 \
            https://raw.githubusercontent.com/ACEsuit/mace-off/91a78c5a9c300d1104700d9352c8bfe449227737/mace_off23/MACE-OFF23_small.model \
            --output "$model.part"
          echo "$checksum  $model.part" | sha256sum --check --strict
          mv "$model.part" "$model"
        fi
        echo "$checksum  $model" | sha256sum --check --strict
        cp "$model" MACE-OFF23_small.model
    - name: Test model extraction
      run: |
        source .venv/bin/activate
        # check compact universal conversion and its default filename
        symmetrix_extract_mace --model MACE-OFF23_small.model
        python3 -c "from symmetrix import Symmetrix; calc = Symmetrix('MACE-OFF23_small-universal.json')"
        # Compare a chemical-symbol subset export with the universal compact
        # export.  The original pair-spline comparison is retired: the original
        # Symmetrix pair-spline format (named v1 here) is no longer loadable
        # through a calculator, and the LAMMPS job covers its retained
        # materialized path end to end.
        symmetrix_extract_mace --model MACE-OFF23_small.model --chemical-symbols H O -o extract_test.json
        python3 - <<'PY'
        import numpy as np
        from ase import Atoms
        from symmetrix import Symmetrix

        atoms = Atoms("OH", positions=[[0, 0, 0], [0, 0, 1]], cell=[10, 10, 10])
        for dtype, energy_tolerance, force_tolerance in (
            ("float64", 1e-10, 1e-9),
            ("float32", 1e-4, 1e-4),
        ):
            for routing in ("direct", "reference"):
                universal_atoms = atoms.copy()
                subset_atoms = atoms.copy()
                universal_atoms.calc = Symmetrix(
                    "MACE-OFF23_small-universal.json",
                    dtype=dtype,
                    streamed_edges=routing,
                )
                subset_atoms.calc = Symmetrix(
                    "extract_test.json", dtype=dtype, streamed_edges=routing,
                )
                assert np.allclose(
                    universal_atoms.get_potential_energy(),
                    subset_atoms.get_potential_energy(),
                    atol=energy_tolerance,
                )
                assert np.allclose(
                    universal_atoms.get_forces(),
                    subset_atoms.get_forces(),
                    atol=force_tolerance,
                )
        PY
        deactivate
