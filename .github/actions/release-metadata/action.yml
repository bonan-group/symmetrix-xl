name: Release metadata gate
description: Validate version sources and, when publishing, the dated changelog and exact release tag.

inputs:
  publish_pypi:
    description: Publication to PyPI was requested
    required: true
    default: "false"
  publish_testpypi:
    description: Publication to TestPyPI was requested
    required: true
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Validate version sources and release tag
      shell: bash
      run: |
        python tools/check_release_metadata.py
        if [[ "${{ inputs.publish_pypi }}" == "true" || "${{ inputs.publish_testpypi }}" == "true" ]]; then
          python tools/check_release_metadata.py --require-tag
        fi
